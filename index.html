<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Meu Hub TV</title>
    <style>
        /* Estilos ultra-compatíveis para navegadores antigos */
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #1f2833;
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 18px;
            color: #c5c6c7;
            margin: 20px 0 10px 0;
        }

        .row {
            margin-bottom: 20px;
        }

        /* Usando inline-block para compatibilidade máxima com TVs antigas */
        .card {
            display: inline-block;
            width: 160px;
            height: 100px;
            background-color: #1f2833;
            margin-right: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            vertical-align: top;
            border: 3px solid transparent;
        }

        .card:hover, .card:focus {
            background-color: #45a29e;
            border-color: #66fcf1;
            color: #0b0c10;
        }

        .card-icon {
            font-size: 32px;
            margin-top: 15px;
            display: block;
        }

        .card-text {
            font-size: 14px;
            margin-top: 10px;
            display: block;
            font-weight: bold;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #c5c6c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            📺 Meu Hub TV - Samsung
        </div>

        <div class="section-title">Aplicativos de Streaming</div>
        <div class="row">
            <a href="https://www.youtube.com" class="card">
                <span class="card-icon">▶️</span>
                <span class="card-text">YouTube</span>
            </a>
            <a href="https://www.netflix.com" class="card">
                <span class="card-icon">🎬</span>
                <span class="card-text">Netflix</span>
            </a>
            <a href="https://www.primevideo.com" class="card">
                <span class="card-icon">📦</span>
                <span class="card-text">Prime Video</span>
            </a>
            <a href="https://www.disneyplus.com" class="card">
                <span class="card-icon">✨</span>
                <span class="card-text">Disney+</span>
            </a>
        </div>

        <div class="section-title">Atalhos e Web</div>
        <div class="row">
            <a href="https://www.google.com" class="card">
                <span class="card-icon">🌐</span>
                <span class="card-text">Google</span>
            </a>
            <a href="https://twitch.tv" class="card">
                <span class="card-icon">🎮</span>
                <span class="card-text">Twitch</span>
            </a>
        </div>

        <div class="footer">
            Use as setas do controle remoto para navegar e OK para abrir.
        </div>
    </div>

    <script>
        // Foco automático no primeiro item para facilitar o controle remoto
        var cards = document.getElementsByClassName('card');
        if(cards.length > 0) {
            cards[0].focus();
        }
    </script>

</body>
</html>
